server:
  port: 8080

logging:
  level:
    root: info
    'vn.sparkminds.template': debug


spring:
  application:
    name: springboot-template
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  main:
    allow-bean-definition-overriding: true
  # ===================================================================
  # Data source and JPA specific properties
  # ===================================================================
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DB_URL:jdbc:mysql://localhost:3306/walletcoin?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
    hikari:
      poolName: Hikari
      auto-commit: false
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: false
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  liquibase:
    contexts: ${LIQUIBASE_CONTEXT:dev}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: transaction-group
      auto-offset-reset: earliest
    listener:
      concurrency: 3
# ===================================================================
# Application properties
# ===================================================================
application:
  security:
    jwt-secret: ${JWT_SECRET:your-very-secure-secret-key-change-this}
    jwt-expiration-in-seconds: ${JWT_EXPIRATION_IN_SECONDS:86400}
